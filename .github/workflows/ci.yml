name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Çek (Checkout)
      uses: actions/checkout@v3

    - name: Python Ortamını Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Bağımlılıkları Yükle (Install Dependencies)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Testleri Çalıştır (Run Tests)
      run: |
        pytest tests/

    - name: Docker İmajını Derle (Build Docker Image)
      run: |
        docker build -t ziyaretci-randevu:latest .
